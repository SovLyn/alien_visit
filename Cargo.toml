[package]
name = "alien_visit"
version = "0.1.0"
edition = "2024"

[dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"
glow = "0.16"
glam = "0.30"
bytemuck = { version = "1", features = ["derive"] }
web-sys = { version = "0.3", features = [
  "Window", "Document", "Element", "HtmlElement", "HtmlCanvasElement",
  "HtmlInputElement", "HtmlButtonElement", "HtmlDivElement", "HtmlSpanElement",
  "NodeList", "Node", "Text", "DomRect", "CssStyleDeclaration", "DomTokenList",
  "DomStringMap", "HtmlBodyElement",
  "WebGl2RenderingContext", "WebGlBuffer", "WebGlShader", "WebGlProgram",
  "WebGlUniformLocation", "WebGlVertexArrayObject", "WebGlTexture",
  "WebGlFramebuffer", "WebGlRenderbuffer", "WebGlActiveInfo",
  "Performance", "console", "KeyboardEvent", "MouseEvent", "PointerEvent",
  "WheelEvent", "TouchEvent", "Touch", "TouchList", "Event", "EventTarget",
  "Navigator", "Location", "UrlSearchParams", "MediaQueryList",
  "WebGlContextAttributes"
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
